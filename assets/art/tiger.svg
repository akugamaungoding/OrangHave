<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%" role="img" aria-labelledby="tiger-title tiger-desc" xmlns:c2pa="http://c2pa.org/manifest">
  <!-- Illustrated character, inspired by real species -->
  <title id="tiger-title">Datuk the Sumatran Tiger</title>
  <desc id="tiger-desc">A gentle watercolor illustration of a young Sumatran tiger sitting calmly, with dark stripes and a soft white muzzle.</desc>
  <defs>
    <filter id="wc-filter-tiger" x="-10%" y="-10%" width="120%" height="120%" filterUnits="objectBoundingBox">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G" result="displaced" />
      <feGaussianBlur in="displaced" stdDeviation="0.6" result="softened" />
      <feMerge>
        <feMergeNode in="softened" />
        <feMergeNode in="SourceGraphic" opacity="0.75" />
      </feMerge>
    </filter>
    <radialGradient id="grad-tiger-fur" cx="45%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#F2A25C" />
      <stop offset="65%" stop-color="#E07B39" />
      <stop offset="100%" stop-color="#C25A24" />
    </radialGradient>
    <radialGradient id="grad-tiger-cream" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFDF7" />
      <stop offset="80%" stop-color="#F5E6C8" />
      <stop offset="100%" stop-color="#E8D4AE" />
    </radialGradient>
    <radialGradient id="grad-tiger-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDF6E3" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#FDF6E3" stop-opacity="0" />
    </radialGradient>
  </defs>

  <circle cx="150" cy="150" r="130" fill="url(#grad-tiger-glow)" />

  <g id="datuk" filter="url(#wc-filter-tiger)">
    <!-- Tail curling around -->
    <path d="M212 238 C252 236 262 206 246 188" stroke="#E07B39" stroke-width="15" stroke-linecap="round" fill="none" />
    <path d="M244 214 L256 208 M236 230 L248 230" stroke="#2C2420" stroke-width="5" stroke-linecap="round" />
    <path d="M246 188 L248 196" stroke="#2C2420" stroke-width="13" stroke-linecap="round" />

    <!-- Body -->
    <ellipse cx="150" cy="212" rx="70" ry="58" fill="url(#grad-tiger-fur)" />
    <!-- Body stripes -->
    <path d="M86 196 Q100 202 104 214" stroke="#2C2420" stroke-width="6" stroke-linecap="round" fill="none" />
    <path d="M84 222 Q98 226 100 238" stroke="#2C2420" stroke-width="6" stroke-linecap="round" fill="none" />
    <path d="M214 196 Q200 202 196 214" stroke="#2C2420" stroke-width="6" stroke-linecap="round" fill="none" />
    <path d="M216 222 Q202 226 200 238" stroke="#2C2420" stroke-width="6" stroke-linecap="round" fill="none" />
    <!-- Cream belly -->
    <ellipse cx="150" cy="222" rx="34" ry="38" fill="url(#grad-tiger-cream)" />

    <!-- Front legs & paws -->
    <rect x="112" y="220" width="26" height="40" rx="13" fill="#E07B39" />
    <rect x="162" y="220" width="26" height="40" rx="13" fill="#E07B39" />
    <path d="M114 238 L136 238 M164 238 L186 238" stroke="#2C2420" stroke-width="4.5" stroke-linecap="round" />
    <ellipse cx="125" cy="260" rx="17" ry="10" fill="#FFF7E8" />
    <ellipse cx="175" cy="260" rx="17" ry="10" fill="#FFF7E8" />
    <path d="M120 256 L120 264 M130 256 L130 264 M170 256 L170 264 M180 256 L180 264" stroke="#D4A574" stroke-width="1.8" stroke-linecap="round" />

    <!-- Ears -->
    <circle cx="100" cy="80" r="20" fill="#E07B39" />
    <circle cx="101" cy="82" r="11" fill="#2C2420" />
    <circle cx="101" cy="83" r="5" fill="#FFF7E8" />
    <circle cx="200" cy="80" r="20" fill="#E07B39" />
    <circle cx="199" cy="82" r="11" fill="#2C2420" />
    <circle cx="199" cy="83" r="5" fill="#FFF7E8" />

    <!-- Head -->
    <ellipse cx="150" cy="122" rx="62" ry="54" fill="url(#grad-tiger-fur)" />
    <!-- Cheek ruffs -->
    <path d="M92 132 Q84 150 104 156 Q100 146 106 140 Z" fill="#FFF7E8" />
    <path d="M208 132 Q216 150 196 156 Q200 146 194 140 Z" fill="#FFF7E8" />
    <!-- Forehead stripes -->
    <path d="M150 72 L150 90" stroke="#2C2420" stroke-width="6" stroke-linecap="round" />
    <path d="M136 76 Q140 86 138 94" stroke="#2C2420" stroke-width="5" stroke-linecap="round" fill="none" />
    <path d="M164 76 Q160 86 162 94" stroke="#2C2420" stroke-width="5" stroke-linecap="round" fill="none" />
    <!-- Side face stripes -->
    <path d="M90 112 Q102 114 108 120" stroke="#2C2420" stroke-width="5" stroke-linecap="round" fill="none" />
    <path d="M92 126 Q102 126 106 132" stroke="#2C2420" stroke-width="4.5" stroke-linecap="round" fill="none" />
    <path d="M210 112 Q198 114 192 120" stroke="#2C2420" stroke-width="5" stroke-linecap="round" fill="none" />
    <path d="M208 126 Q198 126 194 132" stroke="#2C2420" stroke-width="4.5" stroke-linecap="round" fill="none" />

    <!-- White eye patches -->
    <ellipse cx="128" cy="112" rx="15" ry="12" fill="#FFF7E8" opacity="0.9" />
    <ellipse cx="172" cy="112" rx="15" ry="12" fill="#FFF7E8" opacity="0.9" />

    <!-- Muzzle -->
    <ellipse cx="150" cy="142" rx="30" ry="22" fill="url(#grad-tiger-cream)" />

    <!-- Eyes -->
    <circle cx="130" cy="113" r="8.5" fill="#3B2A10" />
    <circle cx="130" cy="113" r="5" fill="#1F1F1F" />
    <circle cx="128" cy="111" r="3" fill="#FFFDF7" />
    <circle cx="132" cy="115.5" r="1.3" fill="#FFFDF7" />
    <circle cx="170" cy="113" r="8.5" fill="#3B2A10" />
    <circle cx="170" cy="113" r="5" fill="#1F1F1F" />
    <circle cx="168" cy="111" r="3" fill="#FFFDF7" />
    <circle cx="172" cy="115.5" r="1.3" fill="#FFFDF7" />

    <!-- Nose & smile -->
    <path d="M141 131 L159 131 L150 140 Z" fill="#B85A5A" />
    <path d="M150 140 L150 146" stroke="#2C2420" stroke-width="2" stroke-linecap="round" />
    <path d="M140 146 Q145 152 150 146 Q155 152 160 146" stroke="#2C2420" stroke-width="2.2" stroke-linecap="round" fill="none" />
    <!-- Whisker dots -->
    <circle cx="134" cy="146" r="1.6" fill="#8C6A4A" />
    <circle cx="130" cy="140" r="1.6" fill="#8C6A4A" />
    <circle cx="166" cy="146" r="1.6" fill="#8C6A4A" />
    <circle cx="170" cy="140" r="1.6" fill="#8C6A4A" />

    <!-- Blush -->
    <circle cx="112" cy="140" r="7" fill="#E8956A" opacity="0.45" />
    <circle cx="188" cy="140" r="7" fill="#E8956A" opacity="0.45" />
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
