<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%" role="img" aria-labelledby="elephant-title elephant-desc" xmlns:c2pa="http://c2pa.org/manifest">
  <!-- Illustrated character, inspired by real species -->
  <title id="elephant-title">Rimba the Sumatran Elephant</title>
  <desc id="elephant-desc">A gentle watercolor illustration of a young Sumatran elephant with soft grey skin, fan-shaped ears and a curled trunk.</desc>
  <defs>
    <filter id="wc-filter-elephant" x="-10%" y="-10%" width="120%" height="120%" filterUnits="objectBoundingBox">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G" result="displaced" />
      <feGaussianBlur in="displaced" stdDeviation="0.6" result="softened" />
      <feMerge>
        <feMergeNode in="softened" />
        <feMergeNode in="SourceGraphic" opacity="0.75" />
      </feMerge>
    </filter>
    <radialGradient id="grad-elephant-skin" cx="45%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#A9A39C" />
      <stop offset="65%" stop-color="#8A847D" />
      <stop offset="100%" stop-color="#6E6863" />
    </radialGradient>
    <radialGradient id="grad-elephant-ear" cx="40%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#E8B9A6" />
      <stop offset="55%" stop-color="#A39A92" />
      <stop offset="100%" stop-color="#7C756F" />
    </radialGradient>
    <radialGradient id="grad-elephant-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDF6E3" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#FDF6E3" stop-opacity="0" />
    </radialGradient>
  </defs>

  <circle cx="150" cy="150" r="130" fill="url(#grad-elephant-glow)" />

  <g id="rimba" filter="url(#wc-filter-elephant)">
    <!-- Body -->
    <ellipse cx="150" cy="208" rx="76" ry="60" fill="url(#grad-elephant-skin)" />

    <!-- Legs -->
    <rect x="98" y="222" width="32" height="44" rx="14" fill="#8A847D" />
    <rect x="170" y="222" width="32" height="44" rx="14" fill="#8A847D" />
    <path d="M104 262 Q108 258 112 262 M114 262 Q118 258 122 262" stroke="#F5E6C8" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M176 262 Q180 258 184 262 M186 262 Q190 258 194 262" stroke="#F5E6C8" stroke-width="3" stroke-linecap="round" fill="none" />

    <!-- Big ears -->
    <path d="M100 88 C56 80 40 128 58 160 C70 180 98 176 108 156 Z" fill="url(#grad-elephant-ear)" />
    <path d="M200 88 C244 80 260 128 242 160 C230 180 202 176 192 156 Z" fill="url(#grad-elephant-ear)" />
    <path d="M70 118 Q80 130 76 148" stroke="#6E6863" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.5" />
    <path d="M230 118 Q220 130 224 148" stroke="#6E6863" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.5" />

    <!-- Head -->
    <ellipse cx="150" cy="118" rx="56" ry="52" fill="url(#grad-elephant-skin)" />
    <!-- Forehead tuft of hair (young elephant) -->
    <path d="M140 68 Q144 58 148 68 Q152 56 156 68 Q160 60 162 70" stroke="#5A544F" stroke-width="2.2" stroke-linecap="round" fill="none" />

    <!-- Trunk curling up -->
    <path d="M150 138 C150 170 140 196 120 200 C106 202 102 188 112 184" stroke="#8A847D" stroke-width="22" stroke-linecap="round" fill="none" />
    <path d="M144 158 L156 158 M140 172 L152 174 M132 186 L142 190" stroke="#6E6863" stroke-width="2" stroke-linecap="round" opacity="0.6" />
    <circle cx="112" cy="184" r="4" fill="#5A544F" />

    <!-- Small tusks -->
    <path d="M128 150 Q124 162 130 166" stroke="#FFFDF7" stroke-width="6" stroke-linecap="round" fill="none" />
    <path d="M172 150 Q176 162 170 166" stroke="#FFFDF7" stroke-width="6" stroke-linecap="round" fill="none" />

    <!-- Eyes -->
    <circle cx="128" cy="112" r="8.5" fill="#1F1F1F" />
    <circle cx="126" cy="110" r="3" fill="#FFFDF7" />
    <circle cx="130" cy="114.5" r="1.3" fill="#FFFDF7" />
    <path d="M119 101 Q126 97 133 100" stroke="#5A544F" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <circle cx="172" cy="112" r="8.5" fill="#1F1F1F" />
    <circle cx="170" cy="110" r="3" fill="#FFFDF7" />
    <circle cx="174" cy="114.5" r="1.3" fill="#FFFDF7" />
    <path d="M181 101 Q174 97 167 100" stroke="#5A544F" stroke-width="2.5" stroke-linecap="round" fill="none" />

    <!-- Smile under trunk -->
    <path d="M136 146 Q140 150 144 147" stroke="#4A4440" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M164 146 Q160 150 156 147" stroke="#4A4440" stroke-width="2" stroke-linecap="round" fill="none" />

    <!-- Blush -->
    <circle cx="112" cy="130" r="7" fill="#E8956A" opacity="0.45" />
    <circle cx="188" cy="130" r="7" fill="#E8956A" opacity="0.45" />
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
