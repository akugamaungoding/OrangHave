<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="hero-title hero-desc" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="hero-title">A satellite watching Indonesia's rainforest</title>
  <desc id="hero-desc">Watercolor-style scene: at dusk a satellite in orbit sends a green radar beam through orange smoke onto a layered rainforest, where small peat fires glow and smoke drifts upward.</desc>
  <style>
    .twinkle { animation: twinkle 3.5s ease-in-out infinite; }
    .twinkle.b { animation-delay: 1.2s; }
    .twinkle.c { animation-delay: 2.3s; }
    .sat { animation: float 6s ease-in-out infinite; transform-origin: 1210px 170px; }
    .beam { animation: sweep 7s ease-in-out infinite; transform-origin: 1210px 185px; }
    .ping { animation: ping 3s ease-out infinite; transform-origin: 1200px 655px; transform-box: view-box; }
    .ping.b { animation-delay: 1.5s; }
    .flame { animation: flicker 1.1s ease-in-out infinite; transform-box: fill-box; transform-origin: center bottom; }
    .flame.b { animation-delay: .35s; }
    .flame.c { animation-delay: .7s; }
    .smoke { animation: rise 14s linear infinite; }
    .smoke.b { animation-delay: -5s; }
    .smoke.c { animation-delay: -9s; }
    @keyframes twinkle { 0%,100% { opacity: .25; } 50% { opacity: .95; } }
    @keyframes float { 0%,100% { transform: translate(0,0) rotate(-6deg); } 50% { transform: translate(-14px,8px) rotate(-3deg); } }
    @keyframes sweep { 0%,100% { transform: rotate(-7deg); } 50% { transform: rotate(9deg); } }
    @keyframes ping { 0% { transform: scale(.2); opacity: .7; } 100% { transform: scale(2.4); opacity: 0; } }
    @keyframes flicker { 0%,100% { transform: scaleY(1) scaleX(1); opacity: .95; } 50% { transform: scaleY(1.25) scaleX(.9); opacity: .75; } }
    @keyframes rise { 0% { transform: translate(0,0); opacity: 0; } 12% { opacity: .55; } 100% { transform: translate(-260px,-420px); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .twinkle, .sat, .beam, .ping, .flame, .smoke { animation: none !important; }
      .smoke { opacity: .35; }
    }
  </style>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c1f24" />
      <stop offset="45%" stop-color="#1f3b3a" />
      <stop offset="72%" stop-color="#8a5a3c" />
      <stop offset="100%" stop-color="#e2915e" />
    </linearGradient>
    <radialGradient id="sun" cx="22%" cy="70%" r="45%">
      <stop offset="0%" stop-color="#f7c58a" stop-opacity=".75" />
      <stop offset="100%" stop-color="#f7c58a" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6ee7b7" stop-opacity=".55" />
      <stop offset="100%" stop-color="#6ee7b7" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb35c" stop-opacity=".9" />
      <stop offset="45%" stop-color="#f97316" stop-opacity=".45" />
      <stop offset="100%" stop-color="#f97316" stop-opacity="0" />
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" result="n" />
      <feDisplacementMap in="SourceGraphic" in2="n" scale="18" />
    </filter>
    <filter id="blur"><feGaussianBlur stdDeviation="18" /></filter>
    <filter id="blur-s"><feGaussianBlur stdDeviation="6" /></filter>
  </defs>

  <!-- Sky -->
  <rect width="1600" height="900" fill="url(#sky)" />
  <rect width="1600" height="900" fill="url(#sun)" />

  <!-- Stars -->
  <g fill="#fdf6e3">
    <circle class="twinkle" cx="120" cy="80" r="1.8" />
    <circle class="twinkle b" cx="260" cy="150" r="1.4" />
    <circle class="twinkle c" cx="410" cy="60" r="2" />
    <circle class="twinkle" cx="560" cy="120" r="1.3" />
    <circle class="twinkle b" cx="700" cy="40" r="1.7" />
    <circle class="twinkle c" cx="860" cy="95" r="1.4" />
    <circle class="twinkle" cx="1010" cy="55" r="1.8" />
    <circle class="twinkle b" cx="1400" cy="70" r="1.6" />
    <circle class="twinkle c" cx="1520" cy="140" r="1.3" />
    <circle class="twinkle" cx="1460" cy="230" r="1.2" />
    <circle class="twinkle b" cx="80" cy="230" r="1.2" />
    <circle class="twinkle c" cx="330" cy="260" r="1.1" />
  </g>

  <!-- Orbit path -->
  <path d="M-50 330 Q 800 -40 1650 250" fill="none" stroke="#fdf6e3" stroke-opacity=".18" stroke-width="2" stroke-dasharray="6 10" />

  <!-- Radar beam from satellite to forest -->
  <g transform="translate(170 110)">
    <g class="beam">
      <path d="M1210 185 L930 580 L1130 580 Z" fill="url(#beam)" />
    </g>
  </g>

  <!-- Satellite -->
  <g transform="translate(170 110)">
  <g class="sat">
    <rect x="1120" y="158" width="62" height="26" rx="3" fill="#7fa8b8" stroke="#d6e6ea" stroke-width="2" />
    <line x1="1120" y1="171" x2="1182" y2="171" stroke="#d6e6ea" stroke-width="1" opacity=".7" />
    <line x1="1141" y1="158" x2="1141" y2="184" stroke="#d6e6ea" stroke-width="1" opacity=".7" />
    <line x1="1161" y1="158" x2="1161" y2="184" stroke="#d6e6ea" stroke-width="1" opacity=".7" />
    <line x1="1182" y1="171" x2="1192" y2="171" stroke="#d6e6ea" stroke-width="3" />
    <rect x="1192" y="152" width="36" height="38" rx="6" fill="#e8d6b0" stroke="#fdf6e3" stroke-width="2" />
    <line x1="1228" y1="171" x2="1238" y2="171" stroke="#d6e6ea" stroke-width="3" />
    <rect x="1238" y="158" width="62" height="26" rx="3" fill="#7fa8b8" stroke="#d6e6ea" stroke-width="2" />
    <line x1="1238" y1="171" x2="1300" y2="171" stroke="#d6e6ea" stroke-width="1" opacity=".7" />
    <line x1="1259" y1="158" x2="1259" y2="184" stroke="#d6e6ea" stroke-width="1" opacity=".7" />
    <line x1="1279" y1="158" x2="1279" y2="184" stroke="#d6e6ea" stroke-width="1" opacity=".7" />
    <ellipse cx="1210" cy="194" rx="16" ry="6" fill="#fdf6e3" />
    <circle cx="1210" cy="196" r="3" fill="#6ee7b7" />
  </g>
  </g>

  <!-- Far smoke haze bank -->
  <g filter="url(#blur)" opacity=".55">
    <ellipse cx="420" cy="560" rx="420" ry="90" fill="#b49a86" />
    <ellipse cx="1150" cy="580" rx="460" ry="80" fill="#a48b78" />
  </g>

  <!-- Far hills -->
  <path filter="url(#soft)" d="M-60 600 Q 160 540 320 575 T 640 560 T 960 575 T 1280 550 T 1600 570 L1600 900 L-60 900 Z" fill="#3c5a45" opacity=".85" />

  <!-- Mid canopy -->
  <g filter="url(#soft)" fill="#2c4a33">
    <path d="M-60 660 Q 60 610 120 640 Q 170 590 230 630 Q 290 600 340 640 Q 400 595 460 635 Q 520 605 580 645 Q 640 600 700 640 Q 760 610 820 650 Q 880 605 940 640 Q 1000 600 1060 640 Q 1120 595 1180 635 Q 1240 605 1300 645 Q 1360 600 1420 640 Q 1480 610 1540 645 Q 1580 625 1600 640 L1600 900 L-60 900 Z" />
  </g>

  <!-- Radar pings where the beam touches the forest -->
  <g fill="none" stroke="#6ee7b7" stroke-width="2.5">
    <ellipse class="ping" cx="1200" cy="655" rx="40" ry="12" />
    <ellipse class="ping b" cx="1200" cy="655" rx="40" ry="12" />
  </g>

  <!-- Peat fires with glow -->
  <g>
    <circle cx="430" cy="655" r="70" fill="url(#glow)" />
    <circle cx="1120" cy="665" r="60" fill="url(#glow)" />
    <circle cx="760" cy="680" r="45" fill="url(#glow)" />
    <path class="flame" d="M418 668 Q 412 640 430 620 Q 434 640 446 644 Q 450 660 442 668 Z" fill="#fb923c" />
    <path class="flame b" d="M424 668 Q 422 650 432 638 Q 436 654 440 668 Z" fill="#fde68a" />
    <path class="flame c" d="M1108 676 Q 1104 652 1120 636 Q 1124 654 1134 658 Q 1136 670 1130 676 Z" fill="#fb923c" />
    <path class="flame" d="M1114 676 Q 1113 660 1121 650 Q 1124 664 1127 676 Z" fill="#fde68a" />
    <path class="flame b" d="M752 688 Q 750 670 762 658 Q 766 672 770 688 Z" fill="#fb923c" />
  </g>

  <!-- Rising smoke plumes -->
  <g filter="url(#blur-s)" fill="#8e7e72">
    <g class="smoke"><ellipse cx="430" cy="610" rx="38" ry="26" /><ellipse cx="410" cy="580" rx="30" ry="22" /></g>
    <g class="smoke b"><ellipse cx="440" cy="615" rx="32" ry="22" /></g>
    <g class="smoke c"><ellipse cx="425" cy="605" rx="26" ry="18" /></g>
    <g class="smoke"><ellipse cx="1120" cy="620" rx="36" ry="24" /></g>
    <g class="smoke b"><ellipse cx="1130" cy="610" rx="30" ry="20" /><ellipse cx="1110" cy="585" rx="24" ry="16" /></g>
    <g class="smoke c"><ellipse cx="765" cy="640" rx="26" ry="18" /></g>
  </g>

  <!-- Near forest with emergent trees -->
  <g filter="url(#soft)">
    <path d="M-60 740 Q 80 690 150 720 Q 210 680 280 715 Q 340 690 400 730 Q 470 695 540 735 Q 620 700 690 740 Q 760 705 830 745 Q 900 700 980 740 Q 1050 705 1120 742 Q 1200 700 1270 738 Q 1340 705 1410 740 Q 1490 700 1560 735 L1600 730 L1600 900 L-60 900 Z" fill="#1e3a26" />
    <!-- emergent trees -->
    <rect x="186" y="600" width="12" height="140" fill="#2a1d14" />
    <ellipse cx="192" cy="600" rx="70" ry="34" fill="#24452c" />
    <ellipse cx="160" cy="612" rx="40" ry="22" fill="#2c5233" />
    <rect x="1376" y="590" width="12" height="150" fill="#2a1d14" />
    <ellipse cx="1382" cy="590" rx="78" ry="36" fill="#24452c" />
    <ellipse cx="1420" cy="604" rx="44" ry="22" fill="#2c5233" />
    <rect x="620" y="640" width="9" height="100" fill="#2a1d14" />
    <ellipse cx="624" cy="640" rx="50" ry="24" fill="#24452c" />
  </g>

  <!-- Orangutan silhouette in the emergent tree, left -->
  <g fill="#120d09" opacity=".9">
    <circle cx="214" cy="628" r="9" />
    <ellipse cx="216" cy="646" rx="11" ry="15" />
    <path d="M206 640 Q 190 628 182 612" stroke="#120d09" stroke-width="5" stroke-linecap="round" fill="none" />
    <path d="M226 642 Q 236 660 232 676" stroke="#120d09" stroke-width="5" stroke-linecap="round" fill="none" />
  </g>

  <!-- Hornbill silhouette flying right -->
  <g fill="#120d09" opacity=".8" transform="translate(1290 470) scale(1.1)">
    <path d="M0 0 Q 18 -14 34 -2 Q 50 -16 70 -6 Q 52 2 38 4 Q 22 10 0 0 Z" />
    <path d="M-2 0 L -18 4 L -2 4 Z" fill="#c2410c" />
  </g>

  <!-- Peat ground & water reflection -->
  <path d="M-60 820 Q 400 790 800 815 T 1600 805 L1600 900 L-60 900 Z" fill="#14281a" />
  <path d="M260 850 Q 520 838 780 852" stroke="#6ee7b7" stroke-opacity=".15" stroke-width="3" fill="none" />

  <!-- Darken top-center slightly for readable text -->
  <radialGradient id="textShade" cx="50%" cy="38%" r="45%">
    <stop offset="0%" stop-color="#06120f" stop-opacity=".45" />
    <stop offset="100%" stop-color="#06120f" stop-opacity="0" />
  </radialGradient>
  <rect width="1600" height="900" fill="url(#textShade)" />
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
