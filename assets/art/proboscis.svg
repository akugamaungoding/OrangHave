<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%" role="img" aria-labelledby="proboscis-title proboscis-desc" xmlns:c2pa="http://c2pa.org/manifest">
  <!-- Illustrated character, inspired by real species -->
  <title id="proboscis-title">Kahau the Proboscis Monkey</title>
  <desc id="proboscis-desc">A gentle watercolor illustration of a proboscis monkey with a long soft nose, russet cap, cream cheeks and a round belly.</desc>
  <defs>
    <filter id="wc-filter-proboscis" x="-10%" y="-10%" width="120%" height="120%" filterUnits="objectBoundingBox">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G" result="displaced" />
      <feGaussianBlur in="displaced" stdDeviation="0.6" result="softened" />
      <feMerge>
        <feMergeNode in="softened" />
        <feMergeNode in="SourceGraphic" opacity="0.75" />
      </feMerge>
    </filter>
    <radialGradient id="grad-proboscis-fur" cx="45%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#D99A6C" />
      <stop offset="65%" stop-color="#C27A4A" />
      <stop offset="100%" stop-color="#9E5A32" />
    </radialGradient>
    <radialGradient id="grad-proboscis-cream" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFDF7" />
      <stop offset="75%" stop-color="#F1E3C6" />
      <stop offset="100%" stop-color="#DCC7A0" />
    </radialGradient>
    <radialGradient id="grad-proboscis-face" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#F6C8A8" />
      <stop offset="100%" stop-color="#E3A07C" />
    </radialGradient>
    <radialGradient id="grad-proboscis-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDF6E3" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#FDF6E3" stop-opacity="0" />
    </radialGradient>
  </defs>

  <circle cx="150" cy="150" r="130" fill="url(#grad-proboscis-glow)" />

  <g id="kahau" filter="url(#wc-filter-proboscis)">
    <!-- Long tail -->
    <path d="M206 236 C250 240 266 210 254 180" stroke="#E6D6B6" stroke-width="10" stroke-linecap="round" fill="none" />

    <!-- Body with cream round belly -->
    <ellipse cx="150" cy="212" rx="64" ry="56" fill="url(#grad-proboscis-fur)" />
    <ellipse cx="150" cy="222" rx="40" ry="40" fill="url(#grad-proboscis-cream)" />

    <!-- Pale grey-cream arms & legs -->
    <ellipse cx="96" cy="208" rx="15" ry="30" fill="#E6D6B6" transform="rotate(18 96 208)" />
    <ellipse cx="204" cy="208" rx="15" ry="30" fill="#E6D6B6" transform="rotate(-18 204 208)" />
    <ellipse cx="114" cy="262" rx="22" ry="12" fill="#E6D6B6" />
    <ellipse cx="186" cy="262" rx="22" ry="12" fill="#E6D6B6" />

    <!-- Head: russet cap -->
    <ellipse cx="150" cy="114" rx="54" ry="50" fill="url(#grad-proboscis-fur)" />
    <!-- Cream cheek ruff -->
    <ellipse cx="150" cy="136" rx="46" ry="34" fill="url(#grad-proboscis-cream)" />
    <!-- Face -->
    <ellipse cx="150" cy="126" rx="30" ry="30" fill="url(#grad-proboscis-face)" />

    <!-- Eyes -->
    <circle cx="137" cy="112" r="7.5" fill="#1F1F1F" />
    <circle cx="135" cy="110" r="2.7" fill="#FFFDF7" />
    <circle cx="139" cy="114" r="1.2" fill="#FFFDF7" />
    <circle cx="163" cy="112" r="7.5" fill="#1F1F1F" />
    <circle cx="161" cy="110" r="2.7" fill="#FFFDF7" />
    <circle cx="165" cy="114" r="1.2" fill="#FFFDF7" />
    <path d="M128 102 Q136 98 143 101" stroke="#9E5A32" stroke-width="2.4" stroke-linecap="round" fill="none" />
    <path d="M172 102 Q164 98 157 101" stroke="#9E5A32" stroke-width="2.4" stroke-linecap="round" fill="none" />

    <!-- The famous long nose -->
    <path d="M150 118 C138 126 134 150 142 160 C146 166 156 166 160 158 C166 148 162 126 150 118 Z" fill="#E8956A" />
    <path d="M150 122 C144 132 142 148 146 156" stroke="#D4733F" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6" />
    <ellipse cx="146" cy="158" rx="2.5" ry="1.8" fill="#9E5A32" />
    <ellipse cx="155" cy="158" rx="2.5" ry="1.8" fill="#9E5A32" />

    <!-- Small smile peeking under nose -->
    <path d="M140 166 Q150 172 160 166" stroke="#7A4528" stroke-width="2" stroke-linecap="round" fill="none" />

    <!-- Blush -->
    <circle cx="120" cy="132" r="6.5" fill="#E8956A" opacity="0.45" />
    <circle cx="180" cy="132" r="6.5" fill="#E8956A" opacity="0.45" />
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
